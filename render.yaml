# One-click free deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: live-interrogation
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
